version: "3.8"

services:
  gaia-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gaia-backend
    restart: unless-stopped
    # Publicado solo en desarrollo (curl y /docs); en producción no se expone.
    ports:
      - "8000:8000"
    volumes:
      - gaia-downloads:/tmp
    environment:
      - MAX_FILE_SIZE_MB=100

  gaia-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gaia-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - gaia-backend

volumes:
  gaia-downloads:
