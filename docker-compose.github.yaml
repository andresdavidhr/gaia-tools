version: "3.8"

services:
  gaia-backend:
    build:
      context: https://github.com/andresdavidh11/gaia-tools.git#main:backend
      dockerfile: Dockerfile
    container_name: gaia-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - gaia-downloads:/tmp
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}

  gaia-frontend:
    build:
      context: https://github.com/andresdavidh11/gaia-tools.git#main:frontend
      dockerfile: Dockerfile
    container_name: gaia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - gaia-backend

volumes:
  gaia-downloads:
